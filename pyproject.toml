[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mjpeg-question-llm"
version = "0.1.0"
description = "Lightweight containerized MJPEG question detection and multimodal LLM processing application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.0.0",
  "pydantic>=2.8.0",
  "pytesseract>=0.3.13",
  "pyyaml>=6.0.2",
  "onnxruntime>=1.18.0",
  "rapidocr>=3.10.0,<4",
  "rapidfuzz>=3.9.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: opt-in live integration tests (require LIVE_INTEGRATION=1 and LLM_API_KEY)",
]
